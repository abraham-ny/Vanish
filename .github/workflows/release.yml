# Builds the Vanish click package with Clickable's CI image. Vanish is a pure QML app, so it is
# architecture-independent: ONE build produces a single vanish_X.Y.Z_all.click. There is no
# "clickable/ci-20.04-all" image; the amd64 image is used to build it (arch-agnostic builder).
# Push a tag "vX.Y.Z" (must equal the version in manifest.json.in) to publish a GitHub Release with
# the .click file. Any other push / PR just uploads it as a workflow artifact.
# Required repository secret: VANISH_API_URL  (Settings > Secrets and variables > Actions)
name: build-click

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare (version check, backend URL)
        env:
          VANISH_API_URL: ${{ secrets.VANISH_API_URL }}
        run: ./ci/prepare.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Build click (arch all)
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD":/work -w /work \
            clickable/ci-20.04-amd64 \
            ./ci/build-click.sh amd64

      - name: Verify the package is arch all
        run: |
          ls -l dist
          shopt -s nullglob
          files=(dist/*.click)
          [ ${#files[@]} -gt 0 ] || { echo "No .click file produced"; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in
              *_all.click) ;;
              *) echo "::error::$f is not an arch-all package (check manifest.json.in and clickable.yaml builder)"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: click-all
          path: dist/*_all.click
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: click-all
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/*.click \
            --repo "${{ github.repository }}" \
            --title "Vanish ${{ github.ref_name }}" \
            --generate-notes